ci:
    autoupdate_branch: 'devel'
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: check-added-large-files
        args: ['--maxkb=100000']
        exclude: |
            (?x)^(
                models/.*|
            )$
    -   id: check-ast
    -   id: check-merge-conflict
    -   id: check-yaml
        args: [--unsafe]
    -   id: debug-statements
    -   id: trailing-whitespace
-   repo: https://github.com/psf/black
    # Held at 25.1.0: 26.x reformats ten files, which belongs in its own change.
    rev: 25.1.0
    hooks:
    -   id: black
        language_version: python3
-   repo: https://github.com/PyCQA/flake8
    rev: 7.5.0
    hooks:
    -   id: flake8
        # --extend-ignore, not --ignore: the latter REPLACES flake8's default
        # ignore list, which switches on E226/W503 -- both of which black
        # itself produces, so the two tools then fight over the same lines.
        args: ['--extend-ignore=E501,E203']
