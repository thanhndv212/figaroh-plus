site_name: FIGAROH
site_description: >-
  A Python toolbox for dynamic parameter identification and geometric
  calibration of robots and humans.
site_url: https://thanhndv212.github.io/figaroh-plus/
repo_url: https://github.com/thanhndv212/figaroh-plus
repo_name: thanhndv212/figaroh-plus
edit_uri: edit/main/docs/source/

docs_dir: docs/source
site_dir: site

# docs/decisions/ is a sibling of docs_dir (docs/source/), not inside it, so
# MkDocs never reads it — no exclude_docs needed to keep it off the built
# site.

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/figaroh-mark-light.svg
  favicon: assets/figaroh-mark-light.svg
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - content.action.edit

extra_css:
  - stylesheets/figaroh.css
extra_javascript:
  - javascripts/figaroh.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            members_order: source
  # Writes llms.txt, llms-full.txt and a Markdown copy of each listed page
  # (used by the "Copy as Markdown" page action and by coding agents).
  - llmstxt:
      markdown_description: >-
        FIGAROH is a Python toolbox for geometric calibration, dynamic
        parameter identification and optimal experiment design of robots.
        Runnable robot examples live in the figaroh-examples repository.
        Agent skills ship in the figaroh repository under skills/.
      full_output: llms-full.txt
      sections:
        Start:
          - start/*.md
          - getting_started.md
        Workflows:
          - workflows/*.md
          - example_workflow.md
          - reporting_and_verification.md
          - tutorials/*.md
        AI agents:
          - agents/*.md
        Concepts:
          - concepts/*.md
        Examples:
          - examples/*.md
        API reference:
          - api/*.md
        Project:
          - further_reading/*.md

nav:
  - Home: index.md
  - Start:
      - Quickstart: start/quickstart.md
      - Installation: getting_started.md
      - FAQ: further_reading/faq.md
  - Workflows:
      - Overview: workflows/index.md
      - Calibrate a robot: workflows/calibration.md
      - Identify dynamics: workflows/identification.md
      - Add your robot: workflows/new-robot.md
      - Plan, fit & verify: example_workflow.md
      - Reports & verdicts: reporting_and_verification.md
      - Tutorials:
          - Overview: tutorials/index.md
          - Calibration walkthrough: tutorials/calibration_walkthrough.md
          - "Calibration: choosing what to estimate": tutorials/calibration_estimation_guide.md
          - Identification walkthrough: tutorials/identification_walkthrough.md
          - Experiment design: tutorials/optimal_design.md
  - AI agents:
      - Overview: agents/index.md
      - Skills: agents/skills.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Configuration system: concepts/configuration.md
      - Calibration estimation methods: concepts/calibration_estimation.md
      - Backends: concepts/backends.md
      - Integration API: concepts/integration.md
  - Reference:
      - Config keys: concepts/config_parameters.md
      - Examples gallery:
          - Overview: examples/index.md
          - UR10: examples/ur10.md
          - TIAGo: examples/tiago.md
          - TALOS: examples/talos.md
          - Stäubli TX40: examples/staubli_tx40.md
          - Config templates: examples/templates.md
      - Python API:
          - Overview: api/index.md
          - Public API and stability: api/stability.md
          - Calibration: api/calibration.md
          - Identification: api/identification.md
          - Optimal: api/optimal.md
          - Backends: api/backends.md
          - Integration: api/integration.md
          - Data contract: api/data.md
          - Measurements: api/measurements.md
          - Tools: api/tools.md
          - Utils: api/utils.md
          - Visualisation: api/visualisation.md
  - Project:
      - Changelog: further_reading/changelog.md
      - Roadmap: further_reading/roadmap.md
      - Delivery plans: further_reading/plans.md
      - Contributing: further_reading/contributing.md
      - Design decisions: further_reading/decisions.md
