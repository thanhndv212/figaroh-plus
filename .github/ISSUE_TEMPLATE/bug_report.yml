name: Bug report
description: Report a reproducible failure or incorrect result.
title: "fix: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Expected and actual behavior
      description: Include the impact and affected area (identification, calibration, optimal, backend, examples, tooling).
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproducer
      description: Commands, configuration, model/data references, units, joint order and seeds. Provide shareable or synthetic data when possible.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and revisions
      description: Core/examples commits, Python, platform, conda environment and relevant solver/backend versions; traceback or output.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and validation
      description: What must change, what must stay correct, and the regression/example evidence needed. Link a milestone or related issue if applicable.
    validations:
      required: true
